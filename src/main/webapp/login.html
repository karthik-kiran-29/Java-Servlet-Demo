<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login Page</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
	<form method="GET" action="/ServletDemo/login" class="flex flex-col h-full w-100 p-auto border solid 1px">
		<div>Login Form</div>
		<h1 >UserName:</h1>
		<input type="text" name ="username" class="border solid 1px"/>
		<h1 >Password:</h1>
		<input type="password" name ="password" class="border solid 1px"/>
		<button type="submit">Submit</button>
	</form>
</body>
